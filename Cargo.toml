[package]
name = "operations-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Structured execution layer for reliable server operations"
license = "MIT"
repository = "https://github.com/skanevi/operations-engine"
publish = false

[[bin]]
name = "ops-engine"
path = "src/main.rs"

[dependencies]
cap-std = "4.0"
clap = { version = "4.5", features = ["derive"] }
minisign-verify = "0.2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
ureq = "3.4.0"
uuid = { version = "1.18", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = "symbols"
